schema_version: 1

context:
  name: faststream
  version: "0.7.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/30/8f/b371519905144ae5b92e43eec6aa7b023fc99e1f142779069d91fada4b46/faststream-${{ version }}.tar.gz
  sha256: f88a1e4b3aa2d205702e3445ed524ae9f89165f1020b0d27d22aefbaa8ee1e66

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faststream = faststream.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.2,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12.0
    - anyio >=4.14.2,<5
    - fast-depends >=3.0.9
    - typer >=0.9,!=0.12,<=0.21.1
    - watchfiles >=0.15.0,<1.2.0

tests:
  - python:
      imports:
        - faststream
      python_version: ${{ python_min }}.*
  - script:
      - faststream --help

about:
  summary: 'FastStream: the simplest way to work with a messaging queues'
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ag2ai/faststream
  repository: https://github.com/ag2ai/faststream
  documentation: https://faststream.airt.ai/latest/

extra:
  recipe-maintainers:
    - carlodri
