schema_version: 1

context:
  name: faststream
  version: "0.7.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/87/b6/d15b1c88f1adc3bf11e4e23f8a057e489e2e60a47f7d4b821a3ae264f4c2/faststream-${{ version }}.tar.gz
  sha256: 9e367d9ba8b59eeafad19f46641b11f20d23a7ed75ea27b2503856a8ae0c075a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faststream = faststream.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.2,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12.0
    - anyio >=4.14.2,<5
    - fast-depends >=3.0.9
    - typer >=0.9,!=0.12,<=0.21.1
    - watchfiles >=0.15.0,<1.2.0

tests:
  - python:
      imports:
        - faststream
      python_version: ${{ python_min }}.*
  - script:
      - faststream --help

about:
  summary: 'FastStream: the simplest way to work with a messaging queues'
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ag2ai/faststream
  repository: https://github.com/ag2ai/faststream
  documentation: https://faststream.airt.ai/latest/

extra:
  recipe-maintainers:
    - carlodri
