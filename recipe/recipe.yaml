schema_version: 1

context:
  name: faststream
  version: "0.7.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/6f/73/d07717b874cdc039b15e6f44b8629d8b00b7abc150167bf8f30132a17d82/faststream-${{ version }}.tar.gz
  sha256: dfba491c665f1b962f7c1262496201340bec8711f7d19a786f13cb1e9e2a5bdd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faststream = faststream.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.2,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12.0
    - anyio >=4.14.2,<5
    - fast-depends >=3.0.9
    - typer >=0.9,!=0.12,<=0.21.1
    - watchfiles >=0.15.0,<1.2.0

tests:
  - python:
      imports:
        - faststream
      python_version: ${{ python_min }}.*
  - script:
      - faststream --help

about:
  summary: 'FastStream: the simplest way to work with a messaging queues'
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ag2ai/faststream
  repository: https://github.com/ag2ai/faststream
  documentation: https://faststream.airt.ai/latest/

extra:
  recipe-maintainers:
    - carlodri
