schema_version: 1

context:
  name: faststream
  version: "0.7.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/a7/3b/f322016151614c9de6df319b40d6a5f6cfda46d1860bad2e867502833fd5/faststream-${{ version }}.tar.gz
  sha256: b0c60ac8cde24ade040cbca4642c14edbd1a220abab985dbe6caf91b1cc61fcb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faststream = faststream.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.2,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12.0
    - anyio >=4.0,<5
    - fast-depends >=3.0.0
    - typer >=0.9,!=0.12,<=0.21.1
    - watchfiles >=0.15.0,<1.2.0

tests:
  - python:
      imports:
        - faststream
      python_version: ${{ python_min }}.*
  - script:
      - faststream --help

about:
  summary: 'FastStream: the simplest way to work with a messaging queues'
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ag2ai/faststream
  repository: https://github.com/ag2ai/faststream
  documentation: https://faststream.airt.ai/latest/

extra:
  recipe-maintainers:
    - carlodri
